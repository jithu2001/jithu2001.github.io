    <style>
      /* Intro screen: kept inline so it renders before any CSS/JS file arrives. */
      .intro-lock { overflow: hidden; }
      #intro { position: fixed; inset: 0; z-index: 200; display: grid; place-items: center; color: #16130f; font-family: Anton, Impact, 'Arial Narrow', sans-serif; --p: 0; }
      #intro .i-sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }
      #intro .i-half { position: absolute; inset: 0; background: #f1e7d3; transition: transform .85s cubic-bezier(.7, 0, .2, 1); }
      #intro .i-a { clip-path: polygon(0 0, 100% 0, 100% 38%, 0 62%); }
      #intro .i-b { clip-path: polygon(0 62%, 100% 38%, 100% 100%, 0 100%); }
      #intro .i-cut { position: absolute; inset: 0; width: 100%; height: 100%; opacity: 0; transition: opacity .2s; }
      #intro .i-cut line { stroke: #16130f; stroke-width: 3; vector-effect: non-scaling-stroke; }
      #intro .i-lines { position: absolute; inset: -20%; opacity: 0; background-image: repeating-conic-gradient(from 0deg at 50% 50%, #16130f 0deg .7deg, transparent .7deg 6deg); -webkit-mask-image: radial-gradient(circle, transparent 26%, #000 70%); mask-image: radial-gradient(circle, transparent 26%, #000 70%); animation: i-burst 1s .12s cubic-bezier(.2, .8, .2, 1) forwards; }
      #intro .i-stage { position: relative; display: flex; flex-direction: column; align-items: center; width: min(560px, 86vw); transition: opacity .25s, transform .35s; }
      #intro .i-seal { display: grid; place-items: center; width: 92px; height: 92px; border-radius: 50%; border: 4px solid #16130f; background: #c8211b; color: #f8f2e5; font-size: 34px; letter-spacing: .02em; box-shadow: 6px 6px 0 #16130f; opacity: 0; animation: i-stamp .6s .05s cubic-bezier(.2, 1.4, .3, 1) forwards; }
      #intro .i-jp { margin: 18px 0 0; font-family: 'Dela Gothic One', sans-serif; font-size: 22px; letter-spacing: .3em; color: #c8211b; opacity: 0; animation: i-fade .45s .3s forwards; }
      #intro .i-name { margin: 6px 0 0; font-size: clamp(40px, 9vw, 72px); line-height: 1; text-transform: uppercase; white-space: nowrap; overflow: hidden; padding-bottom: 4px; }
      #intro .i-name span { display: inline-block; transform: translateY(110%); animation: i-rise .6s calc(.22s + var(--i) * .07s) cubic-bezier(.22, 1, .36, 1) forwards; }
      #intro .i-sea { position: relative; width: 100%; height: 64px; margin-top: 26px; opacity: 0; animation: i-fade .45s .4s forwards; }
      #intro .i-waves { position: absolute; left: 0; right: 0; bottom: 4px; width: 100%; height: 14px; overflow: visible; }
      #intro .i-waves path { fill: none; stroke: #1d4f86; stroke-width: 2; stroke-dasharray: 3 5; vector-effect: non-scaling-stroke; opacity: .55; }
      #intro .i-wake { position: absolute; left: 0; bottom: 9px; height: 4px; width: calc(var(--p) * (100% - 54px) + 10px); background: #c8211b; border: 1.5px solid #16130f; }
      #intro .i-ship { position: absolute; bottom: 6px; left: calc(var(--p) * (100% - 54px)); animation: i-bob 1.6s ease-in-out infinite; }
      #intro .i-status { margin: 14px 0 0; font: 500 12.5px/1 'IBM Plex Mono', ui-monospace, monospace; letter-spacing: .14em; text-transform: uppercase; color: #6b5f4f; opacity: 0; animation: i-fade .45s .45s forwards; }
      /* Hold the name until Anton has loaded (or 1.2s passes) so it never flashes in a fallback font. */
      #intro:not(.f) .i-name span, #intro:not(.f) .i-jp { animation-play-state: paused; }
      #intro.out { pointer-events: none; }
      #intro.out .i-stage { opacity: 0; transform: scale(1.06); }
      #intro.out .i-lines { opacity: 0 !important; transition: opacity .2s; }
      #intro.out .i-cut { opacity: 1; }
      #intro.out .i-a { transform: translate(-4%, -105%); transition-delay: .18s; }
      #intro.out .i-b { transform: translate(4%, 105%); transition-delay: .18s; }
      @keyframes i-stamp { 0% { opacity: 0; transform: scale(2.6) rotate(-24deg); } 60% { opacity: 1; transform: scale(.92) rotate(-4deg); } 100% { opacity: 1; transform: scale(1) rotate(-8deg); } }
      @keyframes i-burst { 0% { opacity: 0; transform: scale(1.5); } 30% { opacity: .16; } 100% { opacity: .07; transform: scale(1); } }
      @keyframes i-rise { to { transform: translateY(0); } }
      @keyframes i-fade { to { opacity: 1; } }
      @keyframes i-bob { 0%, 100% { translate: 0 0; rotate: -2deg; } 50% { translate: 0 -3px; rotate: 2deg; } }

  <body>
    <!--
      Intro / loading screen. Inline on purpose: it paints with the first bytes, before the JS bundle.
      Progress follows real loading (fonts, app mounted, portrait decoded). About 3.5s on screen (the ship's voyage), max 7s, plays on every load,
      and skipped entirely for prefers-reduced-motion.
    -->
    <div id="intro" role="status" aria-live="polite">
      <span class="i-sr">Loading Jithu J George's portfolio</span>
      <div class="i-half i-a"></div>
      <div class="i-half i-b"></div>
      <svg class="i-cut" viewBox="0 0 100 100" preserveAspectRatio="none" aria-hidden="true"><line x1="0" y1="62" x2="100" y2="38" /></svg>
      <div class="i-lines" aria-hidden="true"></div>
      <div class="i-stage" aria-hidden="true">
        <div class="i-seal">JJG</div>
        <p class="i-jp">出航</p>
        <p class="i-name"><span style="--i:0">JITHU</span> <span style="--i:1">J</span> <span style="--i:2">GEORGE</span></p>
        <div class="i-sea">
          <svg class="i-waves" viewBox="0 0 400 20" preserveAspectRatio="none"><path d="M0 10 Q 10 2 20 10 T 40 10 T 60 10 T 80 10 T 100 10 T 120 10 T 140 10 T 160 10 T 180 10 T 200 10 T 220 10 T 240 10 T 260 10 T 280 10 T 300 10 T 320 10 T 340 10 T 360 10 T 380 10 T 400 10" /></svg>
          <div class="i-wake"></div>
          <div class="i-ship">
            <svg viewBox="0 0 64 56" width="54" height="47">
              <path d="M31 4v34" stroke="#16130f" stroke-width="2.5" />
              <path d="M33 6c12 4 16 14 16 24H33z" fill="#f8f2e5" stroke="#16130f" stroke-width="2.5" stroke-linejoin="round" />
              <path d="M29 10c-9 4-13 12-13 20h13z" fill="#f8f2e5" stroke="#16130f" stroke-width="2.5" stroke-linejoin="round" />
              <circle cx="41" cy="19" r="3.5" fill="#16130f" />
              <path d="M31 4l10 3-10 3" fill="#c8211b" stroke="#16130f" stroke-width="1.5" />
              <path d="M6 38h52l-7 12H13z" fill="#c8211b" stroke="#16130f" stroke-width="2.5" stroke-linejoin="round" />
            </svg>
          </div>
        </div>
        <p class="i-status">Setting sail <span id="i-pct">0</span>%</p>
      </div>
    </div>
    <script>
      ;(function () {
        var el = document.getElementById('intro')
        var root = document.documentElement
        var reduce = window.matchMedia('(prefers-reduced-motion: reduce)').matches
        window.__introDone = false
        function done() {
          if (window.__introDone) return
          window.__introDone = true
          window.dispatchEvent(new Event('intro:done'))
        }
        if (reduce || !el) {
          if (el) el.remove()
          window.__appReady = function () {}
          done()
          return
        }
        root.classList.add('intro-lock')
        // VOYAGE: how long the ship takes to cross once the intro is visible. HOLD: pause at 100% before the split.
        var start = performance.now(), shownAt = 0, VOYAGE = 3200, HOLD = 350, MAX = 7000, fullAt = 0
        el.addEventListener('animationstart', function () { if (!shownAt) shownAt = performance.now() })
        var target = 8, shown = 0, exiting = false
        var steps = { dom: 25, fonts: 55, app: 80, art: 100 }
        var got = {}
        function hit(k) { got[k] = true; target = Math.max(target, steps[k]); if (got.fonts && got.app && got.art) target = 100 }
        var pct = document.getElementById('i-pct')
        function tick(now) {
          // The ship never outruns real loading, and never finishes faster than the voyage.
          var u = shownAt ? Math.min((now - shownAt) / VOYAGE, 1) : 0
          var paced = 100 * (u < 0.5 ? 2 * u * u : 1 - Math.pow(-2 * u + 2, 2) / 2)
          var goal = Math.min(target, paced)
          shown += (goal - shown) * 0.18
          if (goal - shown < 0.3) shown = goal
          el.style.setProperty('--p', (shown / 100).toFixed(3))
          pct.textContent = Math.round(shown)
          if (shown >= 100 && !fullAt) fullAt = now
          if ((fullAt && now - fullAt >= HOLD) || now - start >= MAX) return leave()
          requestAnimationFrame(tick)
        }
        function leave() {
          if (exiting) return
          exiting = true
          el.classList.add('out')
          root.classList.remove('intro-lock')
          done() // hero entrance starts as the panels split
          setTimeout(function () { el.remove() }, 900)
        }
        document.addEventListener('DOMContentLoaded', function () { hit('dom') })
        function fontsOk() { el.classList.add('f') }
        setTimeout(fontsOk, 1200)
        if (document.fonts && document.fonts.load) {
          Promise.all([document.fonts.load('40px Anton'), document.fonts.load('20px "Dela Gothic One"', '出航')]).then(fontsOk, fontsOk)
          document.fonts.ready.then(function () { hit('fonts') })
        } else { fontsOk(); hit('fonts') }
        window.__appReady = function () { hit('app') }
        var art = new Image()
        art.onload = art.onerror = function () { hit('art') }
        art.src = '/portrait.jpg'
        requestAnimationFrame(tick)
      })()
    </script>
